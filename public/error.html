s Chat · Tu próxima conversación está cerca.</footer></main><script>const modes={error:['Algo no salió como esperábamos','No pudimos abrir esta pantalla. Comprueba tu conexión o vuelve a intentarlo.','Error de carga'],disabled:['Nexus Chat no está disponible','El acceso está deshabilitado temporalmente. Vuelve a comprobarlo más tarde.','Acceso temporalmente deshabilitado'],offline:['Parece que no hay conexión','Comprueba tu conexión a internet y vuelve a intentarlo.','Sin conexión']};const mode=new URLSearchParams(location.search).get('mode'),copy=modes[mode];if(copy){document.getElementById('title').textContent=copy[0];document.getElementById('description').textContent=copy[1];document.getElementById('label').textContent=copy[2];}</script></body></html>
