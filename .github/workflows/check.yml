name: Comprobar Nexus Chat
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run test:dashboard-ai
      - run: npm run test:dashboard-owner
      - run: npm run test:account-references
      - run: npm run test:cleanup
      - run: npm run test:references
      - run: npm run test:contact-menu
      - run: npm run test:google-contacts
      - run: npm run test:contacts
      - run: npm run test:message-policy
      - run: npm run test:poll-privacy
      - run: npm run test:image-clipboard
      - run: npm run test:rich-text
      - run: npm run build:hosting
