name: Comprobar Nexus Chat
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run test:dashboard-ai
      - run: npm run test:dashboard-owner
      - run: npm run test:account-references
      - run: npm run test:cleanup
      - run: npm run test:references
      - run: npm run test:contact-menu
      - run: npm run test:google-contacts
      - run: npm run test:google-contacts:preference
      - run: npm run test:google-contacts:apps-script
      - run: npm run test:google-contacts:bridge
      - run: npm run test:contacts
      - run: npm run test:message-policy
      - run: npm run test:poll-privacy
      - run: npm run test:image-clipboard
      - run: npm run test:recording-camera
      - run: npm run test:guest-identity
      - run: npm run test:assistant-media
      - run: npm run test:assistant-confirmation
      - run: npm run test:speech
      - run: npm run test:background-notifications
      - run: npm run test:voice-media-session
      - run: npm run test:call-audio-output
      - run: npm run test:voice-download
      - run: npm run test:country
      - run: npm run test:browser-permissions
      - run: npm run test:massive
      - run: npm run test:rich-text
      - run: npm run build:hosting
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-nexus --config firebase.emulators.json --only auth,firestore,database "npm run test:google-contacts:privacy && npm run test:guest:emulators && npm run test:security:emulators && npm run test:retention:emulators && npm run test:message-policy:emulators && npm run test:anonymous-polls:emulators && npm run test:channels:emulators && npm run test:country:emulators"
